name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          find scripts packages -type f \( -name '*.sh' -o -path '*/DEBIAN/postinst' -o -path '*/DEBIAN/prerm' \) \
            -print0 | xargs -0 -r -n1 bash -n
      - name: Validate patch count and secrets policy
        run: bash ./scripts/check-repository.sh
